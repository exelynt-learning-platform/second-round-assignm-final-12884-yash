spring.application.name=Ecommerce

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db2?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=7781
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (must be at least 32 characters for HS256)
jwt.secret=mySuperSecureJwtSecretKeyForEcommerceApp12345XYZ

# Stripe Configuration
stripe.api.key=YOUR_STRIPE_SECRET_KEY
stripe.webhook.secret=YOUR_WEBHOOK_SECRET_KEY